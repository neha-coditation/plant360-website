document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--accent,#0f62fe); margin-top:18px; letter-spacing:.08em;\">COMPOUNDS IN PRODUCTION<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DIFFERENTIATOR: WE DO BOTH -->\n  <section id=\"approach\" style=\"background:#161616; color:#f4f4f4;\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:96px 32px;\">\n      <div style=\"max-width:840px; margin-bottom:52px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#78a9ff; margin-bottom:22px;\">The Plant360 difference<\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.4vw,44px); font-weight:300; line-height:1.13; letter-spacing:-.015em; margin:0 0 22px;\">Don't choose between your system of record and your AI. <span style=\"font-weight:500; color:#fff;\">Plant360 does both.<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.65; color:#c6c6c6; font-weight:300; margin:0;\">Most tools force a trade-off. Digitize into your system of record and engineers stay current, but AI has nothing structured to reason on. Build a separate knowledge graph and the AI works, but your records quietly drift out of date. Plant360 produces <strong style=\"color:#fff; font-weight:500;\">both, from one pipeline<\u002Fstrong>, working from your CAD, DWG and PDF drawings, or the data already in your existing systems of record.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- DIAGRAM: sources -> convert -> both outputs -->\n      <div style=\"display:grid; grid-template-columns:1fr 92px 1.3fr; border:1px solid #393939; background:#1c1c1c;\">\n        <!-- SOURCES -->\n        <div style=\"padding:34px 30px; border-right:1px solid #2a2a2a;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6f6f6f; margin-bottom:20px;\">INGEST FROM<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px;\">\n            <span style=\"border:1px solid #393939; background:#202020; padding:11px 14px; font-size:14px; color:#c6c6c6;\">CAD files<\u002Fspan>\n            <span style=\"border:1px solid #393939; background:#202020; padding:11px 14px; font-size:14px; color:#c6c6c6;\">DWG drawings<\u002Fspan>\n            <span style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--accent,#0f62fe); background:#202020; padding:11px 14px; font-size:14px; color:#fff;\">PDF drawings <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:#78a9ff; border:1px solid #2f4d86; padding:3px 6px;\">EVEN SCANNED<\u002Fspan><\u002Fspan>\n            <span style=\"border:1px solid #393939; background:#202020; padding:11px 14px; font-size:14px; color:#c6c6c6;\">Datasheets &amp; specs<\u002Fspan>\n            <span style=\"border:1px solid #393939; background:#202020; padding:11px 14px; font-size:14px; color:#c6c6c6;\">Existing records / design data<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:12.5px; line-height:1.55; color:#6f6f6f; margin:18px 0 0;\">Not just DWGs. Plant360 reads the legacy and scanned PDFs that lock most of your plant's knowledge in place, and ingests the data already living in your systems of record.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- CONVERT CONNECTOR -->\n        <div style=\"display:flex; align-items:center; justify-content:center; background:#181818;\">\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:12px;\">\n            <span style=\"font-size:18px; color:#525252;\">→<\u002Fspan>\n            <div style=\"writing-mode:vertical-rl; transform:rotate(180deg); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.18em; color:#78a9ff; border:1px solid var(--accent,#0f62fe); padding:18px 9px; background:#202020;\">INGEST<\u002Fdiv>\n            <span style=\"font-size:18px; color:#525252;\">→<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- OUTPUTS -->\n        <div style=\"padding:34px 30px; border-left:1px solid #2a2a2a;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:#78a9ff; margin-bottom:20px;\">PRODUCES BOTH · IN SYNC<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <div style=\"border-left:3px solid var(--accent,#0f62fe); background:#202020; padding:20px 22px;\">\n              <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:8px;\"><span style=\"width:30px; height:30px; border:1px solid #393939; display:flex; align-items:center; justify-content:center; font-size:14px; color:#f4f4f4;\">▤<\u002Fspan><div style=\"font-size:16.5px; font-weight:500; color:#f4f4f4;\">System of Record / Design<\u002Fdiv><\u002Fdiv>\n              <p style=\"font-size:14px; line-height:1.6; color:#a8a8a8; margin:0;\">Your authoritative engineering data: drawings, tags and datasheets, kept continuously current and audit-ready. No drift, no stale copies.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"border-left:3px solid var(--accent,#0f62fe); background:#202020; padding:20px 22px;\">\n              <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:8px;\"><span style=\"width:30px; height:30px; border:1px solid #393939; display:flex; align-items:center; justify-content:center; font-size:14px; color:#f4f4f4;\">⬡<\u002Fspan><div style=\"font-size:16.5px; font-weight:500; color:#f4f4f4;\">Asset Knowledge Graph<\u002Fdiv><\u002Fdiv>\n              <p style=\"font-size:14px; line-height:1.6; color:#a8a8a8; margin:0;\">A living, queryable graph of every asset and relationship: the structured context your AI agents reason and act on.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- BENEFITS TRIAD -->\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#393939; border:1px solid #393939; border-top:none; margin-top:-1px;\">\n        <div style=\"background:#161616; padding:32px 28px; border-top:2px solid var(--accent,#0f62fe);\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#6f6f6f; margin-bottom:14px;\">01<\u002Fdiv>\n          <h4 style=\"font-size:18px; font-weight:500; margin:0 0 10px; color:#f4f4f4;\">Records that never drift<\u002Fh4>\n          <p style=\"font-size:14.5px; line-height:1.6; color:#8d8d8d; margin:0;\">Engineers keep working in the system of record and design they already trust. Plant360 keeps it accurate automatically as the plant changes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#161616; padding:32px 28px; border-top:2px solid var(--accent,#0f62fe);\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#6f6f6f; margin-bottom:14px;\">02<\u002Fdiv>\n          <h4 style=\"font-size:18px; font-weight:500; margin:0 0 10px; color:#f4f4f4;\">AI with real context<\u002Fh4>\n          <p style=\"font-size:14.5px; line-height:1.6; color:#8d8d8d; margin:0;\">Agents act on a connected asset graph instead of scattered files, so automation is accurate, explainable and grounded in your actual plant.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#161616; padding:32px 28px; border-top:2px solid var(--accent,#0f62fe);\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#6f6f6f; margin-bottom:14px;\">03<\u002Fdiv>\n          <h4 style=\"font-size:18px; font-weight:500; margin:0 0 10px; color:#f4f4f4;\">One pipeline, zero duplication<\u002Fh4>\n          <p style=\"font-size:14.5px; line-height:1.6; color:#8d8d8d; margin:0;\">Both outputs come from a single digitization of CAD, DWG and PDF. No parallel data programs, no divergence between what's recorded and what your AI sees.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PLATFORM: 4 LAYERS -->\n  <section id=\"platform\" style=\"background:#fff;\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:48px 32px 96px;\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:14px; flex-wrap:wrap;\">\n        <h3 style=\"font-size:13px; font-family:'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:#6f6f6f; font-weight:500; margin:0;\">The platform · four connected layers<\u002Fh3>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#a8a8a8;\">DIGITIZE → STRUCTURE → BUILD → APPLY<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); border:1px solid #e0e0e0; border-bottom:3px solid var(--accent,#0f62fe);\">\n        <div style=\"border-right:1px solid #e0e0e0; padding:32px 26px 36px; transition:background .2s;\" style-hover=\"background:#f4f4f4\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent,#0f62fe); letter-spacing:.1em;\">01<\u002Fspan><span style=\"width:34px; height:34px; border:1px solid #e0e0e0; display:flex; align-items:center; justify-content:center; color:#161616;\">▤<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px; font-family:'IBM Plex Mono',monospace; color:#6f6f6f; letter-spacing:.08em; margin-bottom:6px;\">CONVERT<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:500; line-height:1.2; margin-bottom:12px;\">Digitize<\u002Fdiv>\n          <p style=\"font-size:14.5px; line-height:1.6; color:#525252; margin:0 0 18px;\">Convert CAD, DWG and even legacy PDF files into intelligent Smart Drawings with human-in-the-loop AI, lossless and audit-ready.<\u002Fp>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#161616; border-top:1px solid #e0e0e0; padding-top:12px;\">70% faster · 50% lower cost<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-right:1px solid #e0e0e0; padding:32px 26px 36px; transition:background .2s;\" style-hover=\"background:#f4f4f4\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent,#0f62fe); letter-spacing:.1em;\">02<\u002Fspan><span style=\"width:34px; height:34px; border:1px solid #e0e0e0; display:flex; align-items:center; justify-content:center; color:#161616;\">⬡<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px; font-family:'IBM Plex Mono',monospace; color:#6f6f6f; letter-spacing:.08em; margin-bottom:6px;\">UNIGRAPH<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:500; line-height:1.2; margin-bottom:12px;\">Structure<\u002Fdiv>\n          <p style=\"font-size:14.5px; line-height:1.6; color:#525252; margin:0 0 18px;\">P&amp;IDs, datasheets and data from your existing systems of record unified into one living knowledge graph, kept continuously in sync.<\u002Fp>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#161616; border-top:1px solid #e0e0e0; padding-top:12px;\">10× retrieval · 80% less hunting<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-right:1px solid #e0e0e0; padding:32px 26px 36px; transition:background .2s;\" style-hover=\"background:#f4f4f4\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent,#0f62fe); letter-spacing:.1em;\">03<\u002Fspan><span style=\"width:34px; height:34px; border:1px solid #e0e0e0; display:flex; align-items:center; justify-con       <\u002Fdiv>\n      <div style=\"border:1px solid #e0e0e0; border-top:none;\">\n        <div style=\"height:440px;\">\n          <x-import component-from-global-scope=\"image-slot\" id=\"platform-screenshot\" shape=\"rect\" placeholder=\"Drop a product screenshot here (Convert / UniGraph / AI360 UI)\" hint-size=\"100%,440px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; padding:12px 16px; border-top:1px solid #e0e0e0; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8d8d8d; letter-spacing:.08em;\"><span>PLANT360 · PRODUCT<\u002Fspan><span>UNIGRAPH WORKSPACE<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW IT WORKS / DATA-TO-AI FLOW -->\n  <section id=\"flow\" style=\"background:#f4f4f4;\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:96px 32px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent,#0f62fe); margin-bottom:22px;\">How it works<\u002Fdiv>\n      <h2 style=\"font-size:clamp(28px,3.4vw,44px); font-weight:300; line-height:1.12; letter-spacing:-.015em; margin:0 0 56px; max-width:760px;\">From document-driven workflows to <span style=\"font-weight:500;\">data-driven, AI-first<\u002Fspan> operations.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#e0e0e0; border:1px solid #e0e0e0;\">\n        <div style=\"background:#fff; padding:40px 32px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#a8a8a8; margin-bottom:24px;\">STEP 01<\u002Fdiv>\n          <div style=\"position:relative; height:88px; border:1px solid #e0e0e0; background:#f9f9f9; margin-bottom:22px; overflow:hidden; padding:15px 16px;\">\n            <div style=\"display:flex; flex-direction:column; gap:8px;\">\n              <div style=\"height:5px; width:62%; background:#d0d0d0;\"><\u0 =\"95\" cy=\"53\" r=\"5\" fill=\"#fff\" stroke=\"#0f62fe\" stroke-width=\"1.5\"><\u002Fcircle>\n              <circle cx=\"160\" cy=\"33\" r=\"5\" fill=\"#fff\" stroke=\"#0f62fe\" stroke-width=\"1.5\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <h4 style=\"font-size:21px; font-weight:500; margin:0 0 12px;\">Sync records &amp; connect<\u002Fh4>\n          <p style=\"font-size:15px; line-height:1.65; color:#525252; margin:0;\">UniGraph keeps your system of record and design continuously in sync, and links every tag, asset and document into one queryable knowledge graph your AI can trust.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff; padding:40px 32px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#a8a8a8; margin-bottom:24px;\">STEP 03<\u002Fdiv>\n          <div style=\"min-height:88px; border:1px solid #e0e0e0; background:#161616; margin-bottom:22px; padding:13px 15px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; line-height:1.95; color:#a8a8a8;\">\n            <div style=\"white-space:nowrap; overflow:hidden;\"><span style=\"color:#42be65;\">✓<\u002Fspan> MoC package · 14 assets<\u002Fdiv>\n            <div style=\"white-space:nowrap; overflow:hidden;\"><span style=\"color:#42be65;\">✓<\u002Fspan> Risk review routed<\u002Fdiv>\n            <div style=\"white-space:nowrap; overflow:hidden;\"><span style=\"color:#78a9ff;\">agent<\u002Fspan> monitoring graph<span style=\"display:inline-block; width:7px; height:12px; background:#78a9ff; margin-left:6px; vertical-align:middle; animation:p360blink 1.1s step-end infinite;\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <h4 style=\"font-size:21px; font-weight:500; margin:0 0 12px;\">Deploy AI agents<\u002Fh4>\n          <p style=\"font-size:15px; line-height:1.65; color:#525252; margin:0;\">Build agents and apps on AI360 that act on the graph, automating MoC, HAZOP, tag registries and more across engineering nt-weight:300; color:#161616; line-height:1; letter-spacing:-.02em;\">40<span style=\"color:var(--accent,#0f62fe);\">%+<\u002Fspan><\u002Fdiv><p style=\"font-size:14.5px; color:#525252; margin:16px 0 0; line-height:1.5;\">Less Management of Change prep time with ChangeIQ<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#e0e0e0; border:1px solid #e0e0e0; border-top:none;\">\n        <div style=\"background:#161616; color:#f4f4f4; padding:40px 32px; display:flex; align-items:baseline; gap:18px;\">\n          <div style=\"font-size:46px; font-weight:300; color:#fff; letter-spacing:-.02em; font-variant-numeric:tabular-nums;\">{{ drawings }}<span style=\"color:#78a9ff;\">+<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#a8a8a8; letter-spacing:.06em;\">ENGINEERING DRAWINGS<br>DIGITIZED<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#161616; color:#f4f4f4; padding:40px 32px; display:flex; align-items:baseline; gap:18px;\">\n          <div style=\"font-size:46px; font-weight:300; color:#fff; letter-spacing:-.02em; font-variant-numeric:tabular-nums;\">{{ datasheets }}<span style=\"color:#78a9ff;\">+<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#a8a8a8; letter-spacing:.06em;\">DATASHEETS &amp; SPECS<br>DIGITIZED<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INTEGRATIONS -->\n  <section id=\"integrations\" style=\"background:#f4f4f4;\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:96px 32px;\">\n      <div style=\"display:grid; grid-template-columns:.85fr 1.15fr; gap:64px; align-items:center;\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent,#0f62fe); margin-bottom:22px;\">Integrations<\u002Fdiv>\n          <h2 style=\"font-size:clamp(28px,3.2vw,42px); font-weight:300; line-height:1.14; letter-spacing:-.015em; margin:0 0 22px;\">Your existing tools are <span style=\"font-weight:500;\">inputs<\u002Fspan>, not the platform.<\u002Fh2>\n          <p style=\"font-size:17px; line-height:1.65; color:#525252; margin:0 0 24px; font-weight:300;\">Plant360 ingests from the systems you already run and pushes structured data back out through an open API. You own the data layer. No proprietary lock-in to any single CAD or asset vendor.<\u002Fp>\n          \n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8d8d8d; letter-spacing:.1em; margin-bottom:14px;\">INGESTS FROM &amp; SYNCS WITH<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#e0e0e0; border:1px solid #e0e0e0;\">\n            <div style=\"background:#fff; height:128px; padding:10px 20px;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"logo-hexagon\" placeholder=\"Hexagon\" hint-size=\"100%,56px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"background:#fff; height:128px; padding:10px 20px;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"logo-aveva\" placeholder=\"AVEVA\" hint-size=\"100%,56px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"background:#fff; height:128px; padding:10px 20px;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"logo-dexpi\" placeholder=\"DEXPI\" hint-size=\"100%,56px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"background:#fff; height:128px; padding:10px 20px;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"logo-smartplant\" placeholder=\"SmartPlant\" hint-size=\"100%,56px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"background:#fff; height:128px; padding:10px 20px;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"logo-sap-maximo\" placeholder=\"SAP / Maximo\" hint-size=\"100%,56px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"background:#fff; height:128px; padding:10px 20px;\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"logo-autodesk\" placeholder=\"Autodesk\" hint-size=\"100%,56px\"><\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#a8a8a8; margin-top:12px; text-align:right;\">Drag &amp; drop each vendor's licensed logo into its slot<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section id=\"demo\" style=\"background:var(--accent,#0f62fe); color:#fff;\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:88px 32px; display:grid; grid-template-columns:1.2fr .8fr; gap:48px; align-items:center;\">\n      <div>\n        <h2 style=\"font-size:clamp(30px,3.8vw,50px); font-weight:300; line-height:1.1; letter-spacing:-.02em; margin:0;\">Ready to turn your plant's documents into AI agents?<\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.6; color:#d0e2ff; margin:22px 0 0; max-width:540px; font-weight:300;\">See the full stack on your own drawings. A 30-minute demo shows digitize → graph → agent, end to end.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:1px; align-items:flex-start;\">\n        <a href=\"#top\" style=\"display:inline-flex; align-items:center; gap:48px; justify-content:space-between; background:#161616; color:#fff; font-size:16px; padding:16px 18px; min-width:260px; text-decoration:none; transition:background .15s;\" style-hover=\"background:#000\">Book a demo<span>→<\u002Fspan><\u002Fa>\n        <a href=\"#platform\" style=\"display:inline-flex; align-items:center; gap:48px; justify-content:space-between; family:'IBM Plex Mono',monospace; font-size:11px; color:#8d8d8d; letter-spacing:.08em; line-height:1.6;\">ISO 27001 CERTIFIED<br>ENTERPRISE-GRADE SECURITY &amp; GOVERNANCE<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.1em; color:#6f6f6f; margin-bottom:18px;\">PLATFORM<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <a href=\"#platform\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">Convert<\u002Fa>\n            <a href=\"#platform\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">UniGraph<\u002Fa>\n            <a href=\"#platform\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">AI360<\u002Fa>\n            <a href=\"#usecases\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">ChangeIQ<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.1em; color:#6f6f6f; margin-bottom:18px;\">COMPANY<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <a href=\"#top\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">About us<\u002Fa>\n            <a href=\"#\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">Blog<\u002Fa>\n            <a href=\"#usecases\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">Use-cases<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.1em; color:#6f6f6f; margin-bottom:18px;\">RESOURCES<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <a href=\"#demo\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">Contact<\u002Fa>\n            <a href=\"#\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">Privacy policy<\u002Fa>\n            <a href=\"#\" style=\"color:#c6c6c6; text-decoration:none; font-size:14.5px;\" style-hover=\"color:#fff\">Terms of service<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding-top:28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;\">\n        <span style=\"font-size:13px; color:#6f6f6f;\">© Plant360.AI 2026. All rights reserved.<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#6f6f6f; letter-spacing:.06em;\">DESIGN SYSTEM: IBM CARBON<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0f62fe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;announcementBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;countUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { useCase: 0, drawings: 0, datasheets: 0, counted: false };\n\n  get cases() {\n    return [\n      { num: \"01\", title: \"Accelerate Digital Twin & Operator Simulation\", product: \"UNIGRAPH + AI360\", agent: \"Twin Data Agent\",\n        desc: \"Feed digital twin and operator training simulator initiatives with structured, connected asset data from UniGraph instead of hand-built models.\",\n        metric: \"30%+ faster implementation\" },\n      { num: \"02\", title: \"Automated Data Sync & Resolution for EAM, CMMS\", product: \"AI360 AGENT\", agent: \"Asset Sync Agent\",\n        desc: \"Keep EAM and CMMS systems continuously in sync with the engineering source of truth. Equipment, tags and hierarchies stay resolved and aligned automatically.\",\n        metric: \"Zero manual reconciliation\" },\n      { num: \"03\", title: \"Reduce errors in PTW / Control of Work\", product: \"PROCESS AI\", agent: \"Control of Work Agent\",\n        desc: \"Ground permits to work and isolations in live, verified plant data. Line-ups, isolation points and equipment states come straight from the asset graph, so permits reflect the plant as it actually is.\",\n        metric: \"Fewer permit errors, less rework\" },\n      { num: \"04\", title: \"Automate Safety & Compliance Analysis\", product: \"PROCESS AI\", agent: \"HAZOP Prep Agent\",\n        desc: \"Process AI reads your P&IDs and proposes nodes, deviations and safeguards, turning weeks of HAZOP, LOPA and compliance preparation into a guided, data-backed review.\",\n        metric: \"50%+ faster HAZOP prep\" },\n      { num: \"05\", title: \"Automate Operations & Maintenance Workflows\", product: \"PROCESS AI\", agent: \"Operations Agent\",\n        desc: \"Automate turnaround and equipment-isolation planning, smart maintenance scheduling and corrosion-loop mapping. Process AI handles the document-heavy busywork.\",\n        metric: \"Fewer manual workflows\" },\n      { num: \"06\", title: \"Automated Management of Change\", product: \"CHANGEIQ APP\", agent: \"MoC Agent on AI360\",\n        desc: \"Digital-first, AI-powered Management of Change. ChangeIQ auto-assembles MoC packages, risk reviews and approval routing directly from your live plant graph, so changes move safely and fast.\",\n        metric: \"40%+ less MoC prep time\" },\n    ];\n  }\n\n    fmt(n) { return Math.round(n).toLocaleString(\"en-US\"); }\n\n  renderVals() {\n    const i = this.state.useCase;\n    const c = this.cases;\n    const a = c[i] || c[0];\n    const rowBase = \"display:flex;align-items:center;gap:16px;padding:20px 22px;cursor:pointer;border-bottom:1px solid #262626;transition:background .15s;background:\";\n    const barBase = \"width:3px;align-self:stretch;transition:background .15s;background:\";\n    const titleBase = \"font-size:15.5px;font-weight:500;transition:color .15s;color:\";\n    const rows = {};\n    c.forEach((u, idx) => {\n      const on = idx === i;\n      rows[\"r\" + idx] = rowBase + (on ? \"#202020\" : \"transparent\");\n      rows[\"b\" + idx] = barBase + (on ? \"var(--accent,#0f62fe)\" : \"transparent\");\n      rows[\"t\" + idx] = titleBase + (on ? \"#f4f4f4\" : \"#8d8d8d\");\n      rows[\"sel\" + idx] = () => this.setState({ useCase: idx });\n    });\n    return {\n      accentVar: this.props.accentColor || \"#0f62fe\",\n      showBar: this.props.announcementBar !== false,\n      ...rows,\n      ucTitle: a.title, ucProduct: a.product, ucDesc: a.desc, ucAgent: a.agent, ucMetric: a.metric,\n      drawings: this.fmt(this.state.drawings),\n      datasheets: this.fmt(this.state.datasheets),\n      metricsRef: (el) => { this._metrics = el; },\n    };\n  }\n\n  componentDidMount() {\n    if (this.props.countUp === false) {\n      this.setState({ drawings: 83000, datasheets: 250000 });\n      return;\n    }\n    const el = this._metrics;\n    if (!el || typeof IntersectionObserver === \"undefined\") { this.animate(); return; }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting && !this.state.counted) {\n          this.setState({ counted: true });\n          this.animate();\n          io.disconnect();\n        }\n      });\n    }, { threshold: 0.25 });\n    io.observe(el);\n    this._io = io;\n  }\n\n  componentWillUnmount() { if (this._io) this._io.disconnect(); }\n\n  animate() {\n    const dur = 1700, t0 = performance.now(), TD = 83000, TS = 250000;\n    const step = (t) => {\n      const p = Math.min(1, (t - t0) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      this.setState({ drawings: TD * e, datasheets: TS * e });\n      if (p < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
